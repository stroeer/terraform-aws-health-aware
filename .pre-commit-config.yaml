# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: c93cb4c14e8710ba80a9ad15407e1f7096174079 # v1.78.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--call-module-type=all
          - --args=--disable-rule=terraform_required_providers
          - --args=--disable-rule=terraform_required_version
      - id: terraform_tfsec
        args:
          - --args=--minimum-severity HIGH --exclude-downloaded-modules
      - id: terraform_providers_lock
        args:
          - --args=-platform=linux_amd64
          - --args=-platform=darwin_amd64
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: f71fa2c1f9cf5cb705f73dffe4b21f7c61470ba9 # v4.4.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: mixed-line-ending
